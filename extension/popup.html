<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BS Meter Settings</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #000000;
        color: #ffffff;
        border-radius: 6px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 14px 0;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #ffffff;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #737373;
        display: inline-block;
      }
      .status-dot.online {
        background: #10b981;
      }
      .status-dot.offline {
        background: #ef4444;
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-size: 12px;
        color: #d4d4d4;
      }

      label {
        font-size: 11px;
        font-weight: 600;
        color: #a3a3a3;
        display: block;
        margin-bottom: 6px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        background: #121212;
        border: 1px solid #262626;
        border-radius: 6px;
        color: #ffffff;
        font-size: 12px;
        margin-bottom: 14px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #ffffff;
      }

      button#saveBtn {
        width: 100%;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid #ffffff;
        background: #ffffff;
        color: #000000;
        transition: all 0.15s ease;
      }
      button#saveBtn:hover {
        background: #e5e5e5;
        border-color: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <h2>
      <span class="status-dot" id="statusDot"></span>
      BS Meter Configuration
    </h2>

    <div class="toggle-row">
      <span>Enable</span>
      <input type="checkbox" id="enabledCheckbox" checked />
    </div>

    <label for="apiUrl">API Address</label>
    <input
      type="text"
      id="apiUrl"
      placeholder="e.g. https://api.yourdomain.com or http://localhost:8000"
    />

    <button id="saveBtn">Save & Apply</button>

    <script src="popup.js"></script>
  </body>
</html>
