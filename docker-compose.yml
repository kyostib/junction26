services:
  db:
    image: postgres:18-alpine
    container_name: bsmeter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bsmeter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bsmeter}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsmeter} -d ${POSTGRES_DB:-bsmeter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: bsmeter_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bsmeter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bsmeter}
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gemini-4-hydrogen}
      MAX_CLAIMS_TO_VERIFY: ${MAX_CLAIMS_TO_VERIFY:-5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
