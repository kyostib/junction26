services:
  db:
    image: postgres:18-alpine
    container_name: bsmeter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bsmeter
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: bsmeter_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/bsmeter
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MAX_CLAIMS_TO_VERIFY: ${MAX_CLAIMS_TO_VERIFY:-5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
